services:
  copilot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: trading-copilot
    restart: unless-stopped
    volumes:
      # Mount host data directory to persist SQLite signals & logs across container restarts
      - ./data:/app/data
    env_file:
      # Optional local environment file (.env or similar)
      - path: .env
        required: false
    environment:
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:-}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - LLM_MODEL=${LLM_MODEL:-openai/gpt-4o}
      - FINNHUB_API_KEY=${FINNHUB_API_KEY:-}
      - PORTFOLIO_CASH=${PORTFOLIO_CASH:-100000}
      - MAX_NOTIONAL_EXPOSURE=${MAX_NOTIONAL_EXPOSURE:-60000}
      - EXECUTION_MODE=${EXECUTION_MODE:-paper}
      - TRADOVATE_ENVIRONMENT=${TRADOVATE_ENVIRONMENT:-demo}
      - TRADOVATE_API_KEY=${TRADOVATE_API_KEY:-}
      - TRADOVATE_API_SECRET=${TRADOVATE_API_SECRET:-}
      - TRADOVATE_USERNAME=${TRADOVATE_USERNAME:-}
      - TRADOVATE_PASSWORD=${TRADOVATE_PASSWORD:-}
      - TRADOVATE_ACCOUNT_ID=${TRADOVATE_ACCOUNT_ID:-}
      - APCA_API_KEY_ID=${APCA_API_KEY_ID:-}
      - APCA_API_SECRET_KEY=${APCA_API_SECRET_KEY:-}
      - ALPACA_KEY_ID=${ALPACA_KEY_ID:-}
      - ALPACA_SECRET_KEY=${ALPACA_SECRET_KEY:-}
      - ALPACA_BASE_URL=${ALPACA_BASE_URL:-}
      - ALPACA_DATA_FEED=${ALPACA_DATA_FEED:-iex}
      - ALPACA_PAPER=${ALPACA_PAPER:-true}
      - IEX_CLOUD_API_TOKEN=${IEX_CLOUD_API_TOKEN:-}
      - LANGCHAIN_TRACING_V2=${LANGCHAIN_TRACING_V2:-false}
      - LANGSMITH_API_KEY=${LANGSMITH_API_KEY:-}
      - LANGCHAIN_API_KEY=${LANGCHAIN_API_KEY:-}
      - LANGCHAIN_PROJECT=${LANGCHAIN_PROJECT:-trading-copilot}
    ports:
      # Prometheus metrics exporter & health probe
      - "9108:9108"
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import urllib.request; urllib.request.urlopen(\"http://localhost:9108/healthz\")' || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    command: ["copilot", "daemon"]
