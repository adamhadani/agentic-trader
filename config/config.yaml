risk:
  min_risk_reward_ratio: 2.0
  min_stop_atr_multiple: 1.5
  deduplication_hours: 12
  lockout_pre_event_minutes: 60
  lockout_post_event_minutes: 30
  earnings_blackout_days: 7

regime:
  vix_compressed_threshold: 15.0
  vix_elevated_threshold: 22.0
  vix_extreme_threshold: 30.0
  cache_ttl_seconds: 900
  yield_curve_enabled: true
  credit_oas_enabled: true
  inflation_breakeven_enabled: true
  hy_oas_elevated_threshold: 3.50 # 350 bps
  hy_oas_critical_threshold: 5.00 # 500 bps

strategies:
  mode: "parallel" # "single" or "parallel"
  active_strategy: "trend_pullback" # active when mode == "single"
  active_strategies: # active when mode == "parallel"
    - "trend_pullback"
    - "squeeze_breakout"
  conflict_resolution: "netting" # "netting", "highest_conviction", "first"
  strategy_allocations:
    trend_pullback: 0.60
    squeeze_breakout: 0.40

  trend_pullback:
    enabled: true
    daily_ema_fast: 50
    daily_ema_slow: 200
    trigger_ema_span: 20
    trigger_atr_distance_mult: 0.5
    rsi_period: 14
    rsi_oversold: 40.0
    rsi_oversold_dip: 45.0
    rsi_overbought: 60.0
    rsi_overbought_surge: 55.0
    atr_period: 14
    atr_multiplier: 1.5

  squeeze_breakout:
    enabled: true
    bb_length: 20
    bb_std: 2.0
    kc_length: 20
    kc_atr_mult: 1.5
    min_squeeze_bars: 5
    volume_factor: 1.3
    volume_sma_period: 20

scheduler:
  cron_hour_interval: 4 # Scan every 4 hours aligned with 4h candle closes
  suggestion_scan_times_et: ["10:35", "14:35"]

sizing:
  mode: "static" # "static", "volatility_targeted"
  target_risk_pct: 0.005 # 0.5% risk per trade
  target_futures_risk_dollars: 300.0
  default_equity_risk_dollars: 250.0
  max_contracts_per_trade: 4
  min_contracts: 1
  max_shares_per_trade: 500
  min_shares: 1.0
  max_risk_pct_cap: 0.01 # 1.0% hard risk cap per trade / tier
  max_trade_notional_cap: 7500.0 # paper desk cap (September 22)
  drawdown_gating_enabled: true
  drawdown_haircut_threshold_pct: 0.03 # scale down size above 3% drawdown
  max_drawdown_stop_pct: 0.06 # halt sizing if drawdown >= 6%
  suggest_tiers_enabled: true # suggest Half, Base, and Max tiers in Telegram

execution:
  entry_evidence_max_age_seconds: 30.0 # age starts before the first account/book read
  broker_request_timeout_seconds: 10.0
  stop_replace_timeout_seconds: 10.0
  close_cancel_timeout_seconds: 10.0
  close_cancel_poll_seconds: 0.25
  algorithm: "immediate" # "immediate", "twap", "vwap"
  min_slice_quantity_futures: 2.0 # minimum contracts to trigger algorithmic slicing
  min_slice_quantity_equity: 100.0 # minimum shares to trigger algorithmic slicing
  twap_slices: 4
  twap_interval_seconds: 5.0
  price_collar_ticks: 2.0 # max allowable ticks from base entry price
  price_collar_pct: 0.001 # 0.10% price collar for equities

friction:
  enabled: true
  futures_commission_per_contract: 0.62
  equity_commission_per_share: 0.005
  futures_slippage_points: 0.25
  equity_slippage_pct: 0.0002

options:
  enabled: true
  default_symbols: ["SPY", "QQQ", "IWM"]
  max_expirations: 3
  risk_free_rate: 0.045
  cache_ttl_seconds: 60

telemetry:
  metrics_enabled: true
  metrics_host: "0.0.0.0"
  metrics_port: 9108

pairs:
  p_value_threshold: 0.05
  min_half_life_bars: 1.0
  max_half_life_bars: 60.0
  lookback_days: 252
  z_score_lookback: 30
  z_entry_threshold: 2.0
  z_exit_threshold: 0.5
  default_pairs:
    - ["SPY", "QQQ"]
    - ["SPY", "IWM"]
    - ["QQQ", "IWM"]
    - ["GLD", "SLV"]
    - ["XLE", "USO"]
    - ["V", "MA"]
    - ["EWA", "EWC"]

backtest:
  initial_cash: 100000.0
  risk_free_rate: 0.045
  max_concurrent_positions: 4
  lookback: "2y"
  monte_carlo_simulations: 1000
  monte_carlo_seed: 42
  min_warmup_bars: 20
  apply_friction: true

session:
  enforce_rth: true
  allow_extended_hours: false
  timezone: "America/New_York"

trailing_stop:
  enabled: true
  mode: "chandelier_atr" # "chandelier_atr" (quant high-water mark), "breakeven_and_trail", "none"
  breakeven_trigger_r: null # null avoids expectancy degradation from entry-price anchoring
  breakeven_buffer_dollars: 5.0
  trail_trigger_r: 1.5
  trail_atr_multiple: 1.5
  trail_step_ticks: 2

market_data:
  evidence:
    max_pages: 100
    max_capture_bytes: 134217728 # 128 MiB per acquisition; never prune retained evidence
    min_free_bytes: 1073741824 # 1 GiB reserve; not an atomic filesystem quota
  primary_equities_provider: "alpaca" # "alpaca" (StockHistoricalDataClient), "yfinance"
  fallback_providers:
    - "yfinance"
  timeout_seconds: 10.0
  max_retries: 2
  retry_backoff_factor: 0.5
  scan_concurrency: 8
  max_requests_per_minute: 150

scan:
  max_cards_per_scan: 1
  max_cards_per_session: 2
  max_cards_per_group_per_session: 1
  max_llm_evaluations_per_scan: 4
  min_bar_coverage: 0.8
  coverage_sessions: 10
  coverage_reference_symbol: "SPY"

database:
  name: "signals"
  url: "postgresql+asyncpg://adamhadani@localhost:5432/agentic_trader"
  pool_size: 10
  max_overflow: 20
  pool_timeout: 30.0
  pool_recycle: 1800
  echo: false
  max_retries: 5
  retry_delay: 2.0

# Read-only prospective session clock evidence; no alpha activation or alerts.
alpha_pipeline:
  daily_panel:
    enabled: true
    protocol_path: config/research/prospective-equity-panel-iex-v1.json
    comparison_protocol_paths:
      - config/research/prospective-equity-baselines-iex-v1.json
    poll_seconds: 60
    max_age_seconds: 1200
    calendar_refresh_seconds: 300
  observations:
    enabled: true
    feed: alpaca:iex
    symbols: [SPY, QQQ]
    timeframe: "15m"
    poll_seconds: 30
    window_seconds: 180
  decisions:
    enabled: true
    feed: alpaca:iex
    symbols: [SPY, QQQ]
    history_days: 14
    poll_seconds: 30
    max_candidates: 12
    max_decisions_per_poll: 128
