portfolio:
  cash: 100000.0
  max_notional_exposure: 60000.0
  max_concurrent_contracts: 2
  max_concurrent_positions: 4
  default_equity_risk_dollars: 250.0

contracts:
  # Micro Futures
  "/MES":
    ticker: "MES=F"
    name: "Micro E-mini S&P 500"
    multiplier: 5.0
    tick_size: 0.25
    asset_class: "futures"
  "/MNQ":
    ticker: "MNQ=F"
    name: "Micro E-mini Nasdaq-100"
    multiplier: 2.0
    tick_size: 0.25
    asset_class: "futures"
  "/MGC":
    ticker: "MGC=F"
    name: "Micro Gold"
    multiplier: 10.0
    tick_size: 0.10
    asset_class: "futures"
  "/MCL":
    ticker: "MCL=F"
    name: "Micro WTI Crude Oil"
    multiplier: 100.0
    tick_size: 0.01
    asset_class: "futures"

  # Core Liquid ETFs
  "SPY":
    ticker: "SPY"
    name: "SPDR S&P 500 ETF Trust"
    multiplier: 1.0
    tick_size: 0.01
    asset_class: "equity"
  "QQQ":
    ticker: "QQQ"
    name: "Invesco QQQ Trust"
    multiplier: 1.0
    tick_size: 0.01
    asset_class: "equity"
  "IWM":
    ticker: "IWM"
    name: "iShares Russell 2000 ETF"
    multiplier: 1.0
    tick_size: 0.01
    asset_class: "equity"
  "GLD":
    ticker: "GLD"
    name: "SPDR Gold Shares"
    multiplier: 1.0
    tick_size: 0.01
    asset_class: "equity"
  "TLT":
    ticker: "TLT"
    name: "iShares 20+ Year Treasury Bond ETF"
    multiplier: 1.0
    tick_size: 0.01
    asset_class: "equity"

  # Mega-Cap Tech Leaders
  "AAPL":
    ticker: "AAPL"
    name: "Apple Inc."
    multiplier: 1.0
    tick_size: 0.01
    asset_class: "equity"
  "MSFT":
    ticker: "MSFT"
    name: "Microsoft Corporation"
    multiplier: 1.0
    tick_size: 0.01
    asset_class: "equity"
  "NVDA":
    ticker: "NVDA"
    name: "NVIDIA Corporation"
    multiplier: 1.0
    tick_size: 0.01
    asset_class: "equity"

risk:
  min_risk_reward_ratio: 2.0
  min_stop_atr_multiple: 1.5
  deduplication_hours: 12
  lockout_pre_event_minutes: 60
  lockout_post_event_minutes: 30

strategies:
  trend_pullback:
    enabled: true
    daily_ema_fast: 50
    daily_ema_slow: 200
    trigger_ema_span: 20
    trigger_atr_distance_mult: 0.5
    rsi_period: 14
    rsi_oversold: 40.0
    rsi_oversold_dip: 45.0
    rsi_overbought: 60.0
    rsi_overbought_surge: 55.0
    atr_period: 14
    atr_multiplier: 1.5

  squeeze_breakout:
    enabled: true
    bb_length: 20
    bb_std: 2.0
    kc_length: 20
    kc_atr_mult: 1.5
    min_squeeze_bars: 5
    volume_factor: 1.3
    volume_sma_period: 20

scheduler:
  cron_hour_interval: 4 # Scan every 4 hours aligned with 4h candle closes

sizing:
  mode: "static" # "static", "volatility_targeted", "fractional_kelly"
  target_risk_pct: 0.005 # 0.5% risk per trade
  target_futures_risk_dollars: 300.0
  default_equity_risk_dollars: 250.0
  max_contracts_per_trade: 4
  min_contracts: 1
  max_shares_per_trade: 500
  min_shares: 1.0
  kelly_fraction: 0.5
  baseline_win_rate: 0.50
