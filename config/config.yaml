portfolio:
  cash: 100000.0
  max_notional_exposure: 60000.0
  max_concurrent_contracts: 2

contracts:
  "/MES":
    ticker: "MES=F"
    name: "Micro E-mini S&P 500"
    multiplier: 5.0
    tick_size: 0.25
  "/MNQ":
    ticker: "MNQ=F"
    name: "Micro E-mini Nasdaq-100"
    multiplier: 2.0
    tick_size: 0.25
  "/MGC":
    ticker: "MGC=F"
    name: "Micro Gold"
    multiplier: 10.0
    tick_size: 0.10
  "/MCL":
    ticker: "MCL=F"
    name: "Micro WTI Crude Oil"
    multiplier: 100.0
    tick_size: 0.01

risk:
  min_risk_reward_ratio: 2.0
  min_stop_atr_multiple: 1.5
  deduplication_hours: 12
  lockout_pre_event_minutes: 60
  lockout_post_event_minutes: 30

strategies:
  trend_pullback:
    enabled: true
    daily_ema_fast: 50
    daily_ema_slow: 200
    trigger_ema_span: 20
    trigger_atr_distance_mult: 0.5
    rsi_period: 14
    atr_period: 14
  squeeze_breakout:
    enabled: true
    bb_length: 20
    bb_std: 2.0
    kc_length: 20
    kc_atr_mult: 1.5
    min_squeeze_bars: 5
    volume_factor: 1.3
    volume_sma_period: 20

scheduler:
  cron_hour_interval: 4 # Scan every 4 hours aligned with 4h candle closes
