name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-typecheck:
    name: Lint, Format & Static Types
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup uv and Python 3.14
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.14"
          enable-cache: true

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y sqlite3 wget
          sudo wget -q -O /usr/local/bin/hadolint https://github.com/hadolint/hadolint/releases/download/v2.15.1/hadolint-Linux-x86_64
          sudo chmod +x /usr/local/bin/hadolint

      - name: Cache pre-commit environments
        uses: actions/cache@v4
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}
          restore-keys: |
            pre-commit-${{ runner.os }}-

      - name: Install Dependencies
        run: uv sync --dev

      - name: Run Pre-Commit Checks
        run: uv run pre-commit run --all-files

  test:
    name: Unit & Impacted Test Suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup uv and Python 3.14
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.14"
          enable-cache: true

      - name: Install Dependencies
        run: uv sync --dev

      - name: Verify Rust impacted backend
        if: github.event_name == 'pull_request'
        run: >-
          uv run python -c
          "from pytest_impacted._rust import RUST_AVAILABLE;
          raise SystemExit(0 if RUST_AVAILABLE else 'pytest-impacted Rust backend is unavailable')"

      - name: Run Impacted Test Suite (pull request)
        if: github.event_name == 'pull_request'
        run: >-
          uv run pytest -v
          --impacted
          --impacted-git-mode=branch
          --impacted-base-branch=origin/main
          --impacted-module=agentic_trader
          --impacted-tests-dir=tests
          --impacted-invalidate-all='.github/workflows/**'
          --impacted-invalidate-all='config/**'

      - name: Run Full Test Suite (main, scheduled, or manual)
        if: github.event_name != 'pull_request'
        run: uv run pytest -v

  postgres-integration:
    name: PostgreSQL Integration
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: test_runner
          POSTGRES_PASSWORD: disposable_ci_password
          POSTGRES_DB: test_agentic_trader
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test_runner -d test_agentic_trader"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_POSTGRES_URL: postgresql+asyncpg://test_runner:disposable_ci_password@127.0.0.1:5432/test_agentic_trader
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.14"
          enable-cache: true
      - run: uv sync --dev
      - name: Migrations and cross-client lifecycle races
        run: uv run pytest tests/integration --run-postgres -v
